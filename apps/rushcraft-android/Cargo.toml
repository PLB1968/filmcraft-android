[package]
name = "rushcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rushcraft: the FilmCraft engine on phones as a native library with Kotlin bindings (UniFFI); the Android app is in android/"

[lib]
name = "rushcraft_android"
# cdylib: the library the Android app loads; lib: the tests
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-edit = { workspace = true }
filmcraft-text = { workspace = true }
filmcraft-geom = { workspace = true }
filmcraft-frame = { workspace = true }
# on-device captions (Whisper) and natural voices (Kokoro), both pure Rust on the CPU; the models
# are downloaded by the app on first use, never shipped
filmcraft-speech = { workspace = true, features = ["whisper"] }
filmcraft-tts = { workspace = true, features = ["kokoro"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# MPL-2.0, pure Rust. The exact version: the Kotlin bindings are generated by the same release
# (bindgen/, a workspace member sharing this lock file) and refuse to load against another one.
uniffi = { version = "=0.32.2", default-features = false }

# the engine's log in logcat (pure Rust; links the system's liblog)
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
